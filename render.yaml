services:
  - type: web
    name: soap-payments-api
    env: ruby
    plan: free
    buildCommand: bundle install && bundle exec rake db:migrate db:seed
    startCommand: bundle exec puma -p $PORT -e production config.ru
    envVars:
      - key: RACK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://soap-payments.vercel.app,https://soap-payments-closed-loop-withdrawa-iota.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: soap-payments-db
          property: connectionString

databases:
  - name: soap-payments-db
    plan: free
    databaseName: soap_prod
    user: soap_user
